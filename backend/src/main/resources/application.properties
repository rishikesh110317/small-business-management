# ================================
# Server
# ================================
server.port=${PORT:8080}

# ================================
# Database
# ================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sbm_saas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ================================
# Flyway
# ================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ================================
# JWT
# ================================
app.jwt.secret=${JWT_SECRET:defaultDevSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm0123456789}
app.jwt.expiration-ms=86400000

# ================================
# CORS
# ================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ================================
# File upload limits
# ================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ================================
# Logging
# ================================
logging.level.com.sbm=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
