# ================================
# H2 In-Memory Database (for dev/testing)
# ================================
spring.datasource.url=jdbc:h2:mem:sbm_saas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ================================
# JPA — auto-create schema from entities
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ================================
# Disable Flyway for H2 profile
# ================================
spring.flyway.enabled=false

# ================================
# H2 Console (access at /h2-console)
# ================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================================
# Server
# ================================
server.port=${PORT:8080}

# ================================
# JWT
# ================================
app.jwt.secret=${JWT_SECRET:devSecretKeyForH2TestingThatIsLongEnoughForHS256AlgorithmRequirements12345}
app.jwt.expiration-ms=86400000

# ================================
# CORS
# ================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ================================
# Logging
# ================================
logging.level.com.sbm=DEBUG
